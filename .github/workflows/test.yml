name: Go Test Check

on:
  pull_request:
    branches:
      - main  # Runs when PR targets main branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'  # Use your Go version

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...
